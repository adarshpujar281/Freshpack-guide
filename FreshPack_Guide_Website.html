<style>
  :root{
    --bg:#0B0C0E; --bg-alt:#0F1114; --surface:#16181C; --surface-2:#1C1F24;
    --line:#2A2D33; --gold:#C9A227; --gold-soft:#E4C466;
    --text:#F3F1EC; --text-dim:#9C978B; --text-faint:#6D6A62;
    --teal:#3FA98A; --teal-soft:#6FD8B5;
    --serif:'Fraunces', Georgia, serif; --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius:10px;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ --bg:#0B0C0E; --bg-alt:#0F1114; --surface:#16181C; --surface-2:#1C1F24; --line:#2A2D33; --text:#F3F1EC; --text-dim:#9C978B; --text-faint:#6D6A62; }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--gold);color:#111;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 32px;}
  @media (max-width:640px){.wrap{padding:0 18px;}}
  button{font-family:var(--sans);}

  /* ===== Header ===== */
  header{position:sticky;top:0;z-index:50;background:rgba(11,12,14,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .headrow{display:flex;align-items:center;gap:24px;height:78px;}
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0;}
  .brand img{width:36px;height:36px;border-radius:50%;display:block;}
  .brand .word{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--text);}
  nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;flex-shrink:0;}
  nav.tabs button{font-size:13.5px;font-weight:600;color:var(--text-dim);background:transparent;border:none;padding:9px 16px;border-radius:999px;cursor:pointer;transition:color .2s,background .2s;}
  nav.tabs button.active{color:#0B0C0E;background:var(--gold-soft);}
  nav.tabs button:not(.active):hover{color:var(--text);}
  .head-search{flex:1;position:relative;max-width:340px;margin-left:auto;}
  .head-search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px 10px 38px;color:var(--text);font-size:13.5px;outline:none;transition:border-color .2s;}
  .head-search input:focus{border-color:var(--gold);}
  .head-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none;}
  .head-search input::placeholder{color:var(--text-faint);}
  .suggest{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.4);display:none;max-height:320px;overflow-y:auto;}
  .suggest.open{display:block;}
  .suggest button{display:block;width:100%;text-align:left;padding:11px 16px;background:transparent;border:none;color:var(--text);font-size:13.5px;cursor:pointer;border-bottom:1px solid var(--line);}
  .suggest button:last-child{border-bottom:none;}
  .suggest button:hover{background:var(--surface-2);}
  .suggest button .sc{color:var(--text-faint);font-size:11.5px;margin-left:8px;}
  @media (max-width:860px){ nav.tabs{display:none;} }
  @media (max-width:560px){ .head-search{max-width:none;} .brand .word{display:none;} }

  /* ===== Page transition ===== */
  main{min-height:70vh;}
  .page{animation:fadeIn .32s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ .page{animation:none;} }

  /* ===== Hero (home) ===== */
  .hero{padding:74px 0 46px;border-bottom:1px solid var(--line);}
  .hero .eyebrow{font-size:13px;color:var(--teal-soft);font-weight:600;margin:0 0 18px;}
  .hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(32px,4.6vw,52px);line-height:1.1;margin:0 0 20px;max-width:16ch;}
  .hero p.lede{font-size:17.5px;line-height:1.6;color:var(--text-dim);max-width:56ch;margin:0 0 36px;}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:38px;}
  .stat{background:var(--surface);padding:22px 22px 20px;}
  .stat .n{font-family:var(--serif);font-size:33px;font-weight:600;color:var(--gold-soft);line-height:1;}
  .stat .l{font-size:12.5px;color:var(--text-dim);margin-top:8px;}
  @media (max-width:720px){.stat-row{grid-template-columns:repeat(2,1fr);}}
  .home-search{max-width:620px;}
  .home-search .search-box{position:relative;}
  .home-search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:17px 24px 17px 50px;color:var(--text);font-size:16px;outline:none;transition:border-color .2s;}
  .home-search input:focus{border-color:var(--gold);}
  .home-search svg{position:absolute;left:20px;top:50%;transform:translateY(-50%);opacity:.55;}
  .home-search input::placeholder{color:var(--text-faint);}
  .home-search .suggest{position:absolute;left:0;right:0;top:calc(100% + 10px);}

  .chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
  .chip{font-size:12.5px;font-weight:600;color:var(--text-dim);border:1px solid var(--line);padding:7px 14px;border-radius:999px;cursor:pointer;background:var(--surface);}
  .chip:hover{border-color:var(--gold);color:var(--text);}

  /* ===== Index / list pages ===== */
  .index-section{padding:44px 0 90px;}
  .breadcrumb{font-size:12.5px;color:var(--text-faint);margin-bottom:14px;}
  .breadcrumb a:hover{color:var(--gold-soft);}
  .index-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
  .index-head h2{font-family:var(--serif);font-size:24px;font-weight:600;margin:0;}
  .index-head .count{font-size:13px;color:var(--text-faint);}
  .filter-row{display:flex;gap:10px;align-items:center;margin-bottom:26px;flex-wrap:wrap;}
  .filter-row .search-box{position:relative;flex:1 1 260px;max-width:380px;}
  .filter-row .search-box input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:12px 18px 12px 40px;color:var(--text);font-size:14px;outline:none;}
  .filter-row .search-box input:focus{border-color:var(--gold);}
  .filter-row .search-box svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.5;}
  select.pillselect{background:var(--surface);border:1px solid var(--line);color:var(--text);font-size:13.5px;font-weight:500;padding:11px 18px;border-radius:999px;cursor:pointer;outline:none;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 20px 18px;cursor:pointer;transition:border-color .18s;text-align:left;}
  .card:hover{border-color:var(--gold);}
  .card .cat{font-size:11.5px;color:var(--teal-soft);font-weight:600;margin-bottom:10px;}
  .card h3{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 10px;}
  .card .pack{font-size:13.5px;color:var(--text-dim);line-height:1.5;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .card .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text-dim);display:inline-block;}
  .pill.high{color:#E08A6B;border-color:#3A2A22;background:#231916;}
  .pill.veryhigh{color:#E2735A;border-color:#3A2119;background:#25140F;}
  .pill.medium{color:var(--gold-soft);border-color:#3A331A;background:#211C10;}
  .pill.low{color:var(--teal-soft);border-color:#1D3630;background:#12211D;}
  .empty{padding:60px 0;text-align:center;color:var(--text-faint);font-size:15px;}

  /* ===== Category cards ===== */
  .cat-card .count{font-size:12.5px;color:var(--text-faint);}

  /* ===== Detail page ===== */
  .detail{padding:44px 0 100px;}
  .detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:34px;flex-wrap:wrap;}
  .detail .cat{font-size:13px;color:var(--teal-soft);font-weight:600;margin-bottom:10px;}
  .detail h1{font-family:var(--serif);font-size:clamp(30px,4vw,44px);font-weight:600;margin:0;line-height:1.1;}
  .back-btn{background:var(--surface);border:1px solid var(--line);color:var(--text-dim);font-size:13px;font-weight:600;padding:10px 18px;border-radius:999px;cursor:pointer;flex-shrink:0;}
  .back-btn:hover{color:var(--text);border-color:var(--gold);}

  .detail-body{display:grid;grid-template-columns:1.5fr 1fr;gap:44px;align-items:start;}
  @media (max-width:860px){.detail-body{grid-template-columns:1fr;}}

  .rec-box{background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:26px 28px;margin-bottom:26px;}
  .rec-box .lbl{font-size:12px;color:var(--gold-soft);font-weight:700;letter-spacing:.03em;margin-bottom:10px;}
  .rec-box .val{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1.35;}

  .why-box{margin-bottom:26px;}
  .why-box .lbl{font-size:12px;color:var(--text-faint);font-weight:700;letter-spacing:.03em;margin-bottom:10px;}
  .why-box p{margin:0;font-size:15.5px;line-height:1.65;color:var(--text-dim);}

  .tagrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}

  .side-panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 26px;}
  .side-panel h4{font-family:var(--serif);font-size:15px;font-weight:600;margin:0 0 18px;color:var(--text);}
  .more-item{margin-bottom:18px;}
  .more-item:last-child{margin-bottom:0;}
  .more-item .k{font-size:11.5px;color:var(--text-faint);margin-bottom:4px;}
  .more-item .v{font-size:13.5px;color:var(--text-dim);line-height:1.55;}
  .more-item ul{margin:4px 0 0;padding-left:18px;color:var(--text-dim);font-size:13.5px;line-height:1.6;}

  .related{margin-top:54px;border-top:1px solid var(--line);padding-top:34px;}
  .related h3{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 18px;}
  .related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  @media (max-width:860px){.related-grid{grid-template-columns:repeat(2,1fr);}}
  .related-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;}
  .related-card:hover{border-color:var(--gold);}
  .related-card .n{font-family:var(--serif);font-size:15.5px;font-weight:600;margin-bottom:4px;}
  .related-card .p{font-size:12px;color:var(--text-faint);}

  /* ===== Footer ===== */
  footer{border-top:1px solid var(--line);padding:36px 0;}
  .footrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
  footer .brand2{font-family:var(--serif);font-size:15px;color:var(--text-dim);}
  footer .meta{font-size:12.5px;color:var(--text-faint);}

  @media (prefers-reduced-motion: reduce){ *{transition-duration:0.01ms !important;} }
</style>
</head>

<script>(function () {
  const app = document.getElementById('app');
  const tabs = document.querySelectorAll('nav.tabs button');
  const headSearch = document.getElementById('headSearch');
  const headSuggest = document.getElementById('headSuggest');

  function slugify(s) {
    return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }
  DATA.forEach(d => { d.slug = slugify(d.name); });
  const bySlug = Object.fromEntries(DATA.map(d => [d.slug, d]));

  function perishTag(level) {
    const cls = level === 'Very High' ? 'veryhigh' : level === 'High' ? 'high' : level === 'Medium' ? 'medium' : 'low';
    return `<span class="pill ${cls}">${level} perishability</span>`;
  }
  function moistTag(level) {
    const cls = level === 'High' ? 'high' : level === 'Medium' ? 'medium' : 'low';
    return `<span class="pill ${cls}">${level} moisture</span>`;
  }
  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const categories = Array.from(new Set(DATA.map(d => d.category))).sort();

  /* ---------------- Suggest dropdown (header search) ---------------- */
  function closeSuggest(){ headSuggest.classList.remove('open'); headSuggest.innerHTML=''; }
  function renderSuggest(q) {
    if (!q) { closeSuggest(); return; }
    const matches = DATA.filter(d => d.name.toLowerCase().includes(q.toLowerCase())).slice(0, 8);
    if (!matches.length) { closeSuggest(); return; }
    headSuggest.innerHTML = matches.map(d => `<button data-slug="${d.slug}">${esc(d.name)}<span class="sc">${esc(d.category)}</span></button>`).join('');
    headSuggest.classList.add('open');
    headSuggest.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => { navigate('/item/' + b.dataset.slug); headSearch.value=''; closeSuggest(); });
    });
  }
  headSearch.addEventListener('input', () => renderSuggest(headSearch.value.trim()));
  headSearch.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = headSearch.value.trim().toLowerCase();
      if (!q) return;
      const exact = DATA.find(d => d.name.toLowerCase() === q);
      const first = exact || DATA.find(d => d.name.toLowerCase().includes(q));
      if (first) { navigate('/item/' + first.slug); headSearch.value=''; closeSuggest(); }
    }
    if (e.key === 'Escape') closeSuggest();
  });
  document.addEventListener('click', e => { if (!e.target.closest('.head-search')) closeSuggest(); });

  /* ---------------- Page renderers ---------------- */
  function renderHome() {
    const total = DATA.length;
    const cats = categories.length;
    const highPerish = DATA.filter(d => d.perishability === 'Very High' || d.perishability === 'High').length;
    const highMoist = DATA.filter(d => d.moisture_sensitivity === 'High').length;
    const topCats = categories.slice(0, 6);

    app.innerHTML = `
      <section class="page hero">
        <div class="wrap">
          <p class="eyebrow">SIH236 · Ministry of Food Processing Industries</p>
          <h1>The right packaging for every commodity, explained.</h1>
          <p class="lede">Search any food item and get a recommended packaging material, backed by shelf life, moisture sensitivity, and perishability data — not a guess.</p>

          <div class="stat-row">
            <div class="stat"><div class="n">${total}</div><div class="l">Indexed commodities</div></div>
            <div class="stat"><div class="n">${cats}</div><div class="l">Categories covered</div></div>
            <div class="stat"><div class="n">${highPerish}</div><div class="l">High-perishability items</div></div>
            <div class="stat"><div class="n">${highMoist}</div><div class="l">High-moisture items</div></div>
          </div>

          <div class="home-search">
            <div class="search-box">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#9C978B" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="#9C978B" stroke-width="2" stroke-linecap="round"/></svg>
              <input type="text" id="homeSearch" placeholder="Search a commodity — mango, milk, turmeric…" autocomplete="off">
              <div class="suggest" id="homeSuggest"></div>
            </div>
            <div class="chip-row">
              ${topCats.map(c => `<button class="chip" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
            </div>
          </div>
        </div>
      </section>
    `;

    const homeSearch = document.getElementById('homeSearch');
    const homeSuggest = document.getElementById('homeSuggest');
    homeSearch.addEventListener('input', () => {
      const q = homeSearch.value.trim();
      if (!q) { homeSuggest.classList.remove('open'); homeSuggest.innerHTML=''; return; }
      const matches = DATA.filter(d => d.name.toLowerCase().includes(q.toLowerCase())).slice(0, 8);
      if (!matches.length) { homeSuggest.classList.remove('open'); homeSuggest.innerHTML=''; return; }
      homeSuggest.innerHTML = matches.map(d => `<button data-slug="${d.slug}">${esc(d.name)}<span class="sc">${esc(d.category)}</span></button>`).join('');
      homeSuggest.classList.add('open');
      homeSuggest.querySelectorAll('button').forEach(b => b.addEventListener('click', () => navigate('/item/' + b.dataset.slug)));
    });
    homeSearch.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const q = homeSearch.value.trim().toLowerCase();
        if (!q) return;
        const exact = DATA.find(d => d.name.toLowerCase() === q);
        const first = exact || DATA.find(d => d.name.toLowerCase().includes(q));
        if (first) navigate('/item/' + first.slug);
      }
    });
    app.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => navigate('/category/' + slugify(c.dataset.cat))));
  }

  function cardHTML(d) {
    return `
      <button class="card" data-slug="${d.slug}">
        <div class="cat">${esc(d.category)}</div>
        <h3>${esc(d.name)}</h3>
        <div class="pack">${esc(d.packaging)}</div>
        <div class="tags">${perishTag(d.perishability)}</div>
      </button>
    `;
  }

  function renderCommodities(presetCategory) {
    app.innerHTML = `
      <section class="page index-section">
        <div class="wrap">
          ${presetCategory ? `<div class="breadcrumb"><a href="#/">Guide</a> / <a href="#/categories">Categories</a> / ${esc(presetCategory)}</div>` : `<div class="breadcrumb"><a href="#/">Guide</a> / Commodities</div>`}
          <div class="index-head">
            <h2 id="idxTitle">${presetCategory ? esc(presetCategory) : 'All commodities'}</h2>
            <span class="count" id="idxCount"></span>
          </div>
          <div class="filter-row">
            <div class="search-box">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#9C978B" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="#9C978B" stroke-width="2" stroke-linecap="round"/></svg>
              <input type="text" id="listSearch" placeholder="Filter this list…" autocomplete="off">
            </div>
            <select class="pillselect" id="listCatFilter">
              <option value="">All categories</option>
              ${categories.map(c => `<option value="${esc(c)}" ${c === presetCategory ? 'selected' : ''}>${esc(c)}</option>`).join('')}
            </select>
          </div>
          <div class="grid" id="listGrid"></div>
          <div class="empty" id="listEmpty" style="display:none;">No commodities match that search.</div>
        </div>
      </section>
    `;

    const listSearch = document.getElementById('listSearch');
    const listCatFilter = document.getElementById('listCatFilter');
    const listGrid = document.getElementById('listGrid');
    const listEmpty = document.getElementById('listEmpty');
    const idxCount = document.getElementById('idxCount');
    const idxTitle = document.getElementById('idxTitle');

    function draw() {
      const q = listSearch.value.trim().toLowerCase();
      const cat = listCatFilter.value;
      const items = DATA.filter(d => {
        const mq = !q || d.name.toLowerCase().includes(q) || d.packaging.toLowerCase().includes(q);
        const mc = !cat || d.category === cat;
        return mq && mc;
      });
      idxCount.textContent = `${items.length} of ${DATA.length}`;
      idxTitle.textContent = cat || 'All commodities';
      if (!items.length) { listGrid.style.display='none'; listEmpty.style.display='block'; return; }
      listGrid.style.display='grid'; listEmpty.style.display='none';
      listGrid.innerHTML = items.map(cardHTML).join('');
      listGrid.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => navigate('/item/' + c.dataset.slug)));
    }
    listSearch.addEventListener('input', draw);
    listCatFilter.addEventListener('change', () => navigate(listCatFilter.value ? '/category/' + slugify(listCatFilter.value) : '/commodities'));
    draw();
  }

  function renderCategories() {
    app.innerHTML = `
      <section class="page index-section">
        <div class="wrap">
          <div class="breadcrumb"><a href="#/">Guide</a> / Categories</div>
          <div class="index-head">
            <h2>Browse by category</h2>
            <span class="count">${categories.length} categories</span>
          </div>
          <div class="grid" id="catGrid"></div>
        </div>
      </section>
    `;
    const catGrid = document.getElementById('catGrid');
    catGrid.innerHTML = categories.map(c => {
      const count = DATA.filter(d => d.category === c).length;
      return `
        <button class="card cat-card" data-cat="${esc(c)}">
          <div class="cat">Category</div>
          <h3>${esc(c)}</h3>
          <div class="count">${count} indexed commodit${count === 1 ? 'y' : 'ies'}</div>
        </button>
      `;
    }).join('');
    catGrid.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => navigate('/category/' + slugify(c.dataset.cat))));
  }

  function renderDetail(slug) {
    const d = bySlug[slug];
    if (!d) { navigate('/commodities'); return; }
    const fullPackagingList = (d.packaging_full || '').split(';').map(s => s.trim()).filter(Boolean);
    const related = DATA.filter(x => x.category === d.category && x.slug !== d.slug).slice(0, 4);

    app.innerHTML = `
      <section class="page detail">
        <div class="wrap">
          <div class="breadcrumb"><a href="#/">Guide</a> / <a href="#/category/${slugify(d.category)}">${esc(d.category)}</a> / ${esc(d.name)}</div>
          <div class="detail-top">
            <div>
              <div class="cat">${esc(d.category)}</div>
              <h1>${esc(d.name)}</h1>
            </div>
            <button class="back-btn" id="backBtn">&larr; Back</button>
          </div>

          <div class="detail-body">
            <div>
              <div class="rec-box">
                <div class="lbl">RECOMMENDED PACKAGING</div>
                <div class="val">${esc(d.packaging)}</div>
              </div>
              <div class="why-box">
                <div class="lbl">WHY</div>
                <p>${esc(d.why)}</p>
              </div>
              <div class="tagrow">
                ${perishTag(d.perishability)}
                ${moistTag(d.moisture_sensitivity)}
              </div>
            </div>

            <div class="side-panel">
              <h4>Reference data</h4>
              <div class="more-item">
                <div class="k">Full shelf life</div>
                <div class="v">${esc(d.shelf_life)}</div>
              </div>
              <div class="more-item">
                <div class="k">Moisture range</div>
                <div class="v">${esc(d.moisture_pct)}</div>
              </div>
              ${fullPackagingList.length > 1 ? `
              <div class="more-item">
                <div class="k">Alternate packaging options</div>
                <ul>${fullPackagingList.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
              </div>` : ''}
            </div>
          </div>

          ${related.length ? `
          <div class="related">
            <h3>More in ${esc(d.category)}</h3>
            <div class="related-grid">
              ${related.map(r => `
                <button class="related-card" data-slug="${r.slug}">
                  <div class="n">${esc(r.name)}</div>
                  <div class="p">${esc(r.packaging)}</div>
                </button>
              `).join('')}
            </div>
          </div>` : ''}
        </div>
      </section>
    `;
    document.getElementById('backBtn').addEventListener('click', () => history.back());
    app.querySelectorAll('.related-card').forEach(c => c.addEventListener('click', () => navigate('/item/' + c.dataset.slug)));
    window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }

  /* ---------------- Router ---------------- */
  function setActiveTab(route) {
    let key = '/';
    if (route.startsWith('/commodities') || route.startsWith('/category') || route.startsWith('/item')) key = route.startsWith('/category') || route.startsWith('/item') ? null : '/commodities';
    if (route.startsWith('/categories')) key = '/categories';
    tabs.forEach(b => b.classList.toggle('active', b.dataset.route === key));
  }

  function navigate(path) { window.location.hash = '#' + path; }

  function render() {
    const hash = window.location.hash.replace(/^#/, '') || '/';
    setActiveTab(hash);
    closeSuggest();

    if (hash === '/' || hash === '') return renderHome();
    if (hash === '/commodities') return renderCommodities();
    if (hash === '/categories') return renderCategories();
    if (hash.startsWith('/category/')) {
      const catSlug = hash.replace('/category/', '');
      const cat = categories.find(c => slugify(c) === catSlug);
      return renderCommodities(cat || null);
    }
    if (hash.startsWith('/item/')) {
      const slug = hash.replace('/item/', '');
      return renderDetail(slug);
    }
    renderHome();
  }

  tabs.forEach(b => b.addEventListener('click', () => navigate(b.dataset.route)));
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
